[FRM_HELP]
FrmHelp.Caption="Pomoc"
FrmHelp.MemHelp="Alternate FileMove

The program offers the possibility to synchronize two folders (to mirror them).
The mirroring process may be done with the usage of several settings (e.g. which 
filenames or types should be used). The aim of this is to make the destination 
folder an exact copy of the source folder. The second thing is to copy just 
changes and delete files from the destination folder which are not contained 
inside the source folder.

NOTE: You are using this program on your own risk. Please make backups of your
files first!

At first, the source and destination folder have to be set. You may select these 
folders by pressing the three dots buttons '...'. The contents of the comboboxes 
for source and destination folder can be erased by using the respective 'X' 
button.

Possible file operations
A) Analyze
This does just a check of the two folders concerning the selected options, no files 
will be copied or deleted.
B) Check again
Might be useful after changing options without the need to scan source and 
destination folder again. Using this no files will be copied or deleted.
C) Execute
For using after A) or B). This will start the file copy/delete processing finally.
D) Synchronize
Source and destination folders are scanned and mirrored (does A) and C) in one
step).

Options within the main window
- 'Add missing files to destination folder' - all files that are contained 
  inside the source folder but missing inside the destination folder are copied 
  into it.
- 'Replace files with different size' - all files, which are contained in 
  both (source and destination folder) but do have different file sizes are 
  replaced inside the destination folder. 
- 'Replace files with different date' - all files, which are contained in 
  both (source and destination folder) but do have different file-timestamps 
  are replaced inside the destination folder. In addition you can select, if any, 
  older or newer files should be replaced.
- 'Replace files with different content' - all files, which are contained 
  in both (source and destination folder) but do have different content are 
  replaced. You may also specify the compare method inside the options dialog.
- 'Remove files, that are not in source folder' - all files, that exist in 
  destination folder but not inside the source folder are deleted from the 
  destination folder.
- 'Include empty folders' - this will include folders that do not contain 
  any files into processing.
- 'Confirm changes' - each copy or delete proceeding must be confirmed.
- 'After processing' - here you may select how the program shall behave 
  once it is done (do nothing, close itself, shutdown Windows - which might 
  not be working on all systems).

More options from the Options-dialog (View->Options):
- 'Show analyzing result' - show a short summary about the affected files,
  if using 'Analyze' or 'Check again'
- File extensions(s) - here you may define file extensions separated by a ;
  - *.* uses all files. Examples: *.bmp;*.jpg, Name*.*, Picture.*
- 'Ignore write protection' - if checked, the program will try to ignore 
  the write protection of files.
- 'Change destination folder automatically' - if checked, the program tries 
  to update the destination folder according to the source folder, if 
  changed (the last folder element is updated).
- 'Use custom copy method' - if checked, the internal copy method is used 
  (checked = safer). If checked you also may specify a file buffer size.
- 'Copy at first' - specifies it copy or delete action comes first.
- 'Compare method' - here a method can be selected for comparing the content 
  of files.
"
FrmHelp.BtnOK="OK"
